
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#050b14">
<title>Street MiniMap | Underground</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:white;font-family:Arial,sans-serif}
#map{position:absolute;inset:0;background:#091522}
.leaflet-tile{filter:brightness(.75) saturate(.8) hue-rotate(155deg)}
.hud{position:absolute;z-index:1000;left:12px;right:12px;pointer-events:none}
.top{top:12px;display:flex;justify-content:space-between;gap:8px}
.brand,.panel,.btn{background:#061321ee;border:1px solid #00f6ff;border-radius:10px;box-shadow:0 0 12px #00f6ff33}
.brand{padding:10px}
.brand strong{color:#00f6ff;font-size:13px;letter-spacing:2px;text-shadow:0 0 8px #00f6ff}
.brand small{display:block;margin-top:5px;color:#a5cbd7;font-size:10px}
#gpsStatus{font-size:10px;color:#ffcf48;margin-top:5px}
.controls{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.btn{color:#00f6ff;padding:10px;font-weight:bold;font-size:11px}
.search{position:absolute;z-index:1001;top:105px;left:12px;right:12px;display:flex;gap:6px}
input{min-width:0;flex:1;padding:12px;background:#061321;color:white;border:1px solid #ff2bd6;border-radius:8px}
#message{position:absolute;z-index:1000;top:155px;left:12px;right:12px;font-size:12px;text-shadow:0 1px 4px black}
.bottom{bottom:14px;display:flex;align-items:flex-end;gap:8px}
.panel{padding:10px}
.speed{min-width:115px}
.label{font-size:10px;letter-spacing:2px;color:#00f6ff}
#speed{font-size:40px;font-weight:bold;text-shadow:0 0 12px #00f6ff}
.unit{font-size:10px;color:#a5cbd7}
.route{flex:1;min-width:0}
#instruction{font-size:12px;margin-top:7px}
#distance{font-size:11px;color:#00f6ff;margin-top:6px}
.player{color:#00f6ff;font-size:30px;text-shadow:0 0 6px #00f6ff,0 0 16px #00f6ff}
.gas{font-size:23px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#061321;color:white}
@media(max-height:600px){#speed{font-size:30px}.panel{padding:7px}.search{top:90px}#message{top:140px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud top">
<div class="brand">
<strong>UNDERGROUND // GPS</strong>
<small>STREET MINIMAP</small>
<div id="gpsStatus">GPS: WAITING</div>
</div>
<div class="controls">
<button class="btn" id="follow">FOLLOW: ON</button>
<button class="btn" id="gasButton">FIND GAS</button>
</div>
</div>
<div class="search">
<input id="destination" placeholder="Enter destination or address">
<button class="btn" id="go">GO</button>
</div>
<div id="message">Waiting for GPS permission...</div>
<div class="hud bottom">
<div class="panel speed">
<div class="label">LIVE SPEED</div>
<div id="speed">0</div>
<div class="unit">MPH</div>
</div>
<div class="panel route">
<div class="label">NAVIGATION</div>
<div id="instruction">Ready to drive</div>
<div id="distance">Enter a destination above</div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const $ = id => document.getElementById(id);
let position = null, marker = null, circle = null;
let following = true, routeLayer = null, gasLayer = null;
let routePoints = [], lastGasSearch = 0;

const map = L.map("map", {zoomControl:false})
  .setView([28.5383,-81.3792], 14);

L.control.zoom({position:"bottomright"}).addTo(map);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

gasLayer = L.layerGroup().addTo(map);

function message(text) {
  $("message").textContent = text;
}

function playerIcon() {
  return L.divIcon({
    className:"",
    html:'<div class="player">▲</div>',
    iconSize:[34,34],
    iconAnchor:[17,17]
  });
}

function gpsError(error) {
  $("gpsStatus").textContent = "GPS: UNAVAILABLE";
  if (error.code === 1) {
    message("Allow location permission for this website in Chrome.");
  } else {
    message("GPS unavailable. Check location settings and try outdoors.");
  }
}

function updateGPS(data) {
  const c = data.coords;
  position = [c.latitude,c.longitude];

  $("gpsStatus").textContent =
    "GPS: ACTIVE • ±" + Math.round(c.accuracy || 0) + "m";

  $("speed").textContent =
    Math.round(Math.max(0,(c.speed || 0) * 2.236936));

  if (!marker) {
    marker = L.marker(position,{icon:playerIcon(),zIndexOffset:1000})
      .addTo(map);
    circle = L.circle(position,{
      radius:c.accuracy || 20,
      color:"#00f6ff",
      fillColor:"#00f6ff",
      fillOpacity:.07
    }).addTo(map);
    map.setView(position,17);
  } else {
    marker.setLatLng(position);
    circle.setLatLng(position);
    circle.setRadius(c.accuracy || 20);
  }

  if (following) map.panTo(position);
  updateRouteProgress();
}

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(updateGPS,gpsError,{
    enableHighAccuracy:true,
    maximumAge:1000,
    timeout:20000
  });
} else {
  message("This browser does not support GPS.");
}

$("follow").onclick = () => {
  following = !following;
  $("follow").textContent = "FOLLOW: " + (following ? "ON" : "OFF");
  if (following && position) map.panTo(position);
};

function clearRoute() {
  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = null;
  routePoints = [];
}

function distanceText(m) {
  return m < 1000 ? Math.round(m) + " m" :
    (m/1000).toFixed(1) + " km";
}

async function makeRoute(lat,lon,name) {
  if (!position) {
    message("Waiting for GPS before calculating a route.");
    return;
  }

  message("Calculating route...");
  $("instruction").textContent = "Finding route...";
  $("distance").textContent = "";

  try {
    const start = position[1] + "," + position[0];
    const end = lon + "," + lat;
    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      start + ";" + end +
      "?overview=full&geometries=geojson&steps=true";

    const response = await fetch(url);
    if (!response.ok) throw Error("Route service unavailable");

    const result = await response.json();
    if (result.code !== "Ok" || !result.routes.length) {
      throw Error("No route found");
    }

    clearRoute();
    const route = result.routes[0];

    routeLayer = L.geoJSON(route.geometry,{
      style:{color:"#ff2bd6",weight:6,opacity:.95}
    }).addTo(map);

    routePoints = route.geometry.coordinates;
    map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});

    $("instruction").textContent = "Route to " + name;
    $("distance").textContent =
      distanceText(route.distance) + " • about " +
      Math.round(route.duration/60) + " min";

    message("Route ready. Follow road signs and drive safely.");
  } catch (e) {
    message("Route failed. Check your connection and try again.");
    $("instruction").textContent = "Route unavailable";
    $("distance").textContent = "Public routing service may be busy";
  }
}

$("go").onclick = async () => {
  const query = $("destination").value.trim();
  if (!query) {
    message("Enter a destination first.");
    return;
  }

  message("Searching for destination...");
  try {
    const url =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(query);

    const response = await fetch(url);
    if (!response.ok) throw Error("Search failed");

    const results = await response.json();
    if (!results.length) {
      message("Place not found. Try entering a full address.");
      return;
    }

    await makeRoute(
      Number(results[0].lat),
      Number(results[0].lon),
      results[0].display_name.split(",")[0]
    );
  } catch (e) {
    message("Destination search failed. Check your internet.");
  }
};

$("destination").addEventListener("keydown",e => {
  if (e.key === "Enter") $("go").click();
});

function updateRouteProgress() {
  if (!position || !routePoints.length) return;

  let nearest = Infinity;
  routePoints.forEach(p => {
    const dy = (p[1]-position[0])*111320;
    const dx = (p[0]-position[1])*111320*
      Math.cos(position[0]*Math.PI/180);
    nearest = Math.min(nearest,Math.hypot(dx,dy));
  });

  if (nearest < 35) {
    $("instruction").textContent = "Continue on highlighted route";
  } else if (nearest < 100) {
    $("instruction").textContent = "Follow highlighted route";
  } else {
    $("instruction").textContent = "You may be off route";
  }
}

$("gasButton").onclick = async () => {
  if (!position) {
    message("Waiting for GPS to find nearby gas stations.");
    return;
  }

  if (Date.now()-lastGasSearch < 10000) {
    message("Wait a few seconds before searching again.");
    return;
  }

  lastGasSearch = Date.now();
  gasLayer.clearLayers();
  message("Searching for gas stations nearby...");

  const lat = position[0], lon = position[1];
  const query =
    '[out:json][timeout:20];(' +
    'node["amenity"="fuel"](around:5000,'+lat+','+lon+');' +
    'way["amenity"="fuel"](around:5000,'+lat+','+lon+');' +
    ');out center tags;';

  try {
    const response = await fetch(
      "https://overpass-api.de/api/interpreter",
      {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(query)
      }
    );

    if (!response.ok) throw Error("Gas search unavailable");
    const result = await response.json();

    const places = (result.elements || []).filter(
      p => p.lat != null || p.center?.lat != null
    );

    if (!places.length) {
      message("No mapped gas stations found within 5 km.");
      return;
    }

    places.forEach(p => {
      const glat = p.lat ?? p.center.lat;
      const glon = p.lon ?? p.center.lon;
      const name = p.tags?.name || "Gas station";

      const icon = L.divIcon({
        className:"",
        html:'<div class="gas">⛽</div>',
        iconSize:[28,28],
        iconAnchor:[14,14]
      });

      const gas = L.marker([glat,glon],{icon}).addTo(gasLayer);
      const content = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = name;
      content.appendChild(title);
      content.appendChild(document.createElement("br"));

      const button = document.createElement("button");
      button.textContent = "Route here";
      button.onclick = () => makeRoute(glat,glon,name);
      content.appendChild(button);
      gas.bindPopup(content);
    });

    message("Found " + places.length +
      " mapped gas stations within about 5 km.");
  } catch (e) {
    message("Gas search unavailable. Try again later.");
  }
};
</script>
</body>
</html>
